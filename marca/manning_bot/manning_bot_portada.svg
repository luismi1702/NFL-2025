<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">

<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="d"/>
    <feFlood flood-color="#EDEDED"/>
    <feComposite in2="d" operator="in" result="borde"/>
    <feMerge><feMergeNode in="borde"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a9c3da"/>
    <stop offset="0.35" stop-color="#5b7c9c"/>
    <stop offset="1" stop-color="#3d5a78"/>
  </linearGradient>
</defs>
<g filter="url(#sticker)">
  <!-- brazo derecho: balon en la cadera -->
  <path d="M630,470 L700,600 L640,690" stroke="#0b1420" stroke-width="74" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M630,470 L700,600 L640,690" stroke="#5b7c9c" stroke-width="58" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="700" cy="600" r="16" fill="#ff8a1f" stroke="#0b1420" stroke-width="4"/>
  <!-- torso -->
  <path d="M300,440 L600,440 L640,560 L600,790 L300,790 L260,560 Z" fill="url(#metal)" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
  <path d="M300,520 L600,520" stroke="#ff8a1f" stroke-width="10" filter="url(#glow)"/>
  <text x="450" y="730" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="190" fill="#EDEDED" stroke="#0b1420" stroke-width="9"
        paint-order="stroke">18</text>
  <!-- balon -->
  <g transform="rotate(-35 625 700)">
    <ellipse cx="625" cy="700" rx="62" ry="38" fill="#8a4b2a" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <path d="M590,700 L660,700" stroke="#EDEDED" stroke-width="6"/>
    <g stroke="#EDEDED" stroke-width="5">
      <line x1="603" y1="690" x2="603" y2="710"/><line x1="618" y1="690" x2="618" y2="710"/>
      <line x1="633" y1="690" x2="633" y2="710"/><line x1="648" y1="690" x2="648" y2="710"/>
    </g>
  </g>
  <!-- hombreras -->
  <ellipse cx="290" cy="465" rx="85" ry="48" fill="url(#metal)" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="610" cy="465" rx="85" ry="48" fill="url(#metal)" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
  <!-- brazo izquierdo: el gesto antes del snap, señalando a la defensa -->
  <path d="M270,470 L175,405 L95,305" stroke="#0b1420" stroke-width="74" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M270,470 L175,405 L95,305" stroke="#5b7c9c" stroke-width="58" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="405" r="16" fill="#ff8a1f" stroke="#0b1420" stroke-width="4"/>
  <line x1="86" y1="292" x2="52" y2="238" stroke="#0b1420" stroke-width="34" stroke-linecap="round"/>
  <line x1="86" y1="292" x2="52" y2="238" stroke="#a9c3da" stroke-width="20" stroke-linecap="round"/>
  <rect x="62" y="278" width="62" height="56" rx="16" fill="#5b7c9c" stroke="#0b1420" stroke-width="8" stroke-linejoin="round" transform="rotate(-38 93 306)"/>
  <path d="M74,300 L108,322" stroke="#0b1420" stroke-width="4"/>
  <!-- cabeza -->
  <g transform="translate(250,70)">
  <g>
    <!-- antena -->
    <line x1="268" y1="62" x2="298" y2="12" stroke="#0b1420" stroke-width="12" stroke-linecap="round"/>
    <line x1="268" y1="62" x2="298" y2="12" stroke="#a9c3da" stroke-width="5" stroke-linecap="round"/>
    <circle cx="300" cy="12" r="11" fill="#ff8a1f" stroke="#0b1420" stroke-width="5" filter="url(#glow)"/>
    <!-- cuello -->
    <rect x="168" y="330" width="70" height="40" fill="#3d5a78" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <!-- orejas: tornillos -->
    <circle cx="96" cy="222" r="24" fill="#3d5a78" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="96" cy="222" r="9" fill="#ff8a1f" stroke="#0b1420" stroke-width="4" filter="url(#glow)"/>
    <circle cx="304" cy="222" r="24" fill="#3d5a78" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="304" cy="222" r="9" fill="#ff8a1f" stroke="#0b1420" stroke-width="4" filter="url(#glow)"/>
    <!-- cara larga con barbilla grande, un poco adelantada -->
    <path d="M112,290 L106,120 Q106,34 200,30 Q294,34 294,120 L292,272
             Q292,338 250,362 Q222,376 188,370 Q132,356 112,290 Z" fill="url(#metal)" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <!-- brillo de la frente -->
    <path d="M128,150 Q130,108 160,92" stroke="#EDEDED" stroke-width="8" fill="none"
          stroke-linecap="round" opacity="0.5"/>
    <circle cx="122" cy="120" r="5" fill="#a9c3da" stroke="#0b1420" stroke-width="3"/><circle cx="278" cy="120" r="5" fill="#a9c3da" stroke="#0b1420" stroke-width="3"/><circle cx="116" cy="250" r="5" fill="#a9c3da" stroke="#0b1420" stroke-width="3"/><circle cx="284" cy="250" r="5" fill="#a9c3da" stroke="#0b1420" stroke-width="3"/>
    
    <g stroke="#ff8a1f" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M150,158 L150,132 L178,132 L178,112"/>
      <path d="M200,160 L200,104"/>
      <path d="M250,158 L250,128 L224,128 L224,112"/>
    </g>
    <g fill="#ffd08a" stroke="#0b1420" stroke-width="2">
      <circle cx="178" cy="112" r="5"/><circle cx="200" cy="104" r="6"/>
      <circle cx="224" cy="112" r="5"/>
    </g>
    <!-- pelo castaño corto con raya al lado -->
    <path d="M104,124 Q96,30 200,24 Q304,30 296,124 Q292,96 272,88 Q252,80 236,84
             L226,64 Q214,84 178,86 Q132,88 104,124 Z" fill="#8a5a32" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <path d="M226,64 L236,84" stroke="#0b1420" stroke-width="5"/>
    <path d="M150,52 Q190,40 222,50" stroke="#b07a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- cejas: una algo mas alta, gesto de listillo -->
    <path d="M132,168 Q158,158 184,166" stroke="#0b1420" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M216,162 Q242,150 268,160" stroke="#0b1420" stroke-width="9" fill="none" stroke-linecap="round"/>
    
    <circle cx="158" cy="206" r="25" fill="#EDEDED" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="168" cy="212" r="10" fill="#ff8a1f" stroke="#0b1420" stroke-width="3" filter="url(#glow)"/>
    <path d="M129,206 A29,29 0 0 1 187,206 L187,204 Q158,198 129,208 Z"
          fill="#3d5a78" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    
    <circle cx="242" cy="206" r="25" fill="#EDEDED" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="252" cy="212" r="10" fill="#ff8a1f" stroke="#0b1420" stroke-width="3" filter="url(#glow)"/>
    <path d="M213,206 A29,29 0 0 1 271,206 L271,204 Q242,198 213,208 Z"
          fill="#3d5a78" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
    <!-- nariz larga y recta -->
    <path d="M196,214 L208,214 L218,276 Q212,286 198,284 L188,280 Z" fill="#a9c3da"
          stroke="#0b1420" stroke-width="5" stroke-linejoin="round"/>
    <!-- surcos de las mejillas -->
    <path d="M168,262 Q156,290 164,312" stroke="#0b1420" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M238,262 Q256,286 252,304" stroke="#0b1420" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- media sonrisa ladeada: rejilla LED -->
    <path d="M160,316 Q206,330 262,300" stroke="#0b1420" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M166,316 Q206,328 256,302" stroke="#ff8a1f" stroke-width="5" fill="none"
          stroke-linecap="round" filter="url(#glow)"/>
    <!-- barbilla partida -->
    <path d="M214,350 Q212,360 206,366" stroke="#0b1420" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g></g>
  <!-- OMAHA! -->
  <path d="M590,40 L850,40 Q870,40 870,60 L870,160 Q870,180 850,180 L700,180 L635,245 L655,180
           L590,180 Q570,180 570,160 L570,60 Q570,40 590,40 Z" fill="#EDEDED" stroke="#0b1420" stroke-width="8" stroke-linejoin="round"/>
  <text x="720" y="133" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="52" fill="#ff8a1f" stroke="#0b1420" stroke-width="4"
        paint-order="stroke">OMAHA!</text>
</g>
<!-- nombre -->
<text x="450" y="872" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
      font-weight="900" font-size="68" fill="#EDEDED" letter-spacing="3">MANNING <tspan fill="#ff8a1f">BOT</tspan></text>
</svg>